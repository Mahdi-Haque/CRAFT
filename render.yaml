services:
  - type: web
    name: craft
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn jobportal.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: craft-db
          property: connectionString
      - key: SECURE_SSL_REDIRECT
        value: "True"

databases:
  - name: craft-db
    databaseName: craft
    user: craft
    plan: free
